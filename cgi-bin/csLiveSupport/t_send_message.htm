<head>
<title>csLiveSupport</title>
<link rel="stylesheet" type="text/css" href="in(htmlurl)/csLiveSupport.css">
</head>

<body>

<form method="post" name="form1" action="in(cgiurl)">
  <input type="hidden" name="command" value="sendemail">

  <div align="center">
    <center>
    <table border="0" width="100%" cellspacing="0" cellpadding="0" height="100%">
      <tr>
        <td width="100%" valign="middle" align="center">
        <div align="center">
          <center>
          <table border="1" cellpadding="5" cellspacing="0" bordercolorlight="#000000" bordercolordark="#FFFFFF" bgcolor="#C0C0C0">
            <tr>
              <td width="100%">
              <table border="0" width="100%" cellspacing="0" cellpadding="3">
                <tr>
                  <td width="100%">
                  <table border="1" cellpadding="5" cellspacing="0" bordercolorlight="#000000" bordercolordark="#FFFFFF" bgcolor="#C0C0C0" width="100%">
                    <tr>
                      <td width="100%">
                      <p align="center"><b><font face="Tahoma">csLiveSupport - 
                      Leave a Message</font></b></td>
                    </tr>
                  </table>
                  </td>
                </tr>
                <tr>
                  <td width="100%">
                  <table border="1" cellpadding="5" cellspacing="0" bordercolorlight="#000000" bordercolordark="#FFFFFF" bgcolor="#C0C0C0" width="100%">
                    <tr>
                      <td width="100%" align="center">
                      <table border="0" cellpadding="3" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="100%">
                        <tr>
                          <td align="center" valign="top">
                          <table border="0" cellpadding="2" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="100%">
                            <tr>
                              <td width="100%">
                              <table border="0" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="100%">
                                <tr>
                                  <td width="100%" align="center"><b>
                                  <font face="Tahoma" size="2">Your Email</font></b></td>
                                </tr>
                                <tr>
                                  <td width="100%" align="center">
                                  <font face="Tahoma">
                                  <input class="aceButton" type="text" name="youremail" size="25"></font></td>
                                </tr>
                              </table>
                              </td>
                            </tr>
                            </table>
                          </td>
                          <td align="left" valign="top">
                          <table border="0" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="100%" cellpadding="2">
                            <tr>
                              <td width="100%" height="19" align="center">
                              <p align="center"><b><font face="Tahoma" size="2">
                              Your Name</font></b></td>
                            </tr>
                            <tr>
                              <td width="100%" height="19" align="center">
                              <font face="Tahoma">
                              <input class="aceButton" type="text" name="yourname" size="25" value=""></font></td>
                            </tr>
                            </table>
                          </td>
                        </tr>
                        <tr>
                          <td colspan="2" align="center" valign="top">
                          <table border="0" cellpadding="2" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="100%">
                            <tr>
                              <td width="100%" align="center"><b>
                              <font face="Tahoma" size="2">Your Message to 
                              Support</font></b></td>
                            </tr>
                            <tr>
                              <td width="100%" align="center">
                              <textarea class="aceButton" rows="3" name="comments" cols="50" value=""></textarea></td>
                            </tr>
                          </table>
                          </td>
                        </tr>
                      </table>
                      </td>
                    </tr>
                  </table>
                  </td>
                </tr>
                <tr>
                  <td width="100%">
                  <table border="1" cellpadding="5" cellspacing="0" bordercolorlight="#000000" bordercolordark="#FFFFFF" bgcolor="#C0C0C0" width="100%">
                    <tr>
                      <td width="100%" align="center">
                      <p align="center">
                      <input class="aceButton" type="submit" value="Send Message" name="B1">&nbsp;
                      </p>
                      </td>
                    </tr>
                  </table>
                  </td>
                </tr>
                <tr>
                  <td width="100%">
                  <table border="1" cellpadding="5" cellspacing="0" bordercolorlight="#000000" bordercolordark="#FFFFFF" bgcolor="#C0C0C0" width="100%">
                    <tr>
                      <td width="100%">
                      <font face="Tahoma" size="1">
        <p align="center"><font size="2"><a href="http://www.cgiscript.net">
        <font face="Tahoma" size="1">Powered by csLiveSupport - © 1999-2002&nbsp;
        -&nbsp; WWW.CGISCRIPT.NET, LLC</font></a></font></font></p>
                      </td>
                    </tr>
                  </table>
                  </td>
                </tr>
              </table>
              </td>
            </tr>
          </table>
          </center>
        </div>
        </td>
      </tr>
    </table>
    </center>
  </div>
</form>

</body>
</html>
