<head>
<title>csLiveSupport</title>
<link rel="stylesheet" type="text/css" href="in(htmlurl)/csLiveSupport.css">
</head>

<body>

<form name=form1 method=post action="in(cgiurl)">
<input type=hidden name=command value="doemailchat">

  <div align="center">
    <center>
    <table cellSpacing="0" borderColorDark="#FFFFFF" cellPadding="5" bgColor="#c0c0c0" borderColorLight="#000000" border="1" style="border-collapse: collapse" bordercolor="#111111">
      <tr>
        <td width="100%" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
        <table cellSpacing="0" cellPadding="3" width="100%" border="0">
          <tr>
            <td width="100%" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
            <table cellSpacing="0" borderColorDark="#ffffff" cellPadding="5" width="100%" bgColor="#c0c0c0" borderColorLight="#000000" border="1">
              <tr>
                <td width="100%" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
                <table cellSpacing="0" cellPadding="2" width="100%" border="0">
                  <tr>
                    <td align="left" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
                    <font face="Tahoma" size="4"><b>csLiveSupport Email Chat</b></font></td>
                    <td align="right" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
                    <p align="right"><font face="Tahoma">
                    <input onclick="window.opener.location.reload();window.close();" type="button" value="Close"></font></p>
                    </td>
                  </tr>
                </table>
                </td>
              </tr>
            </table>
            </td>
          </tr>
          <tr>
            <td width="100%" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
            <table cellSpacing="0" borderColorDark="#ffffff" cellPadding="5" width="100%" bgColor="#c0c0c0" borderColorLight="#000000" border="1">
              <tr>
                <td width="100%" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
                <table cellSpacing="0" cellPadding="0" width="100%" border="0">
                  <tr>
                    <td style="font-family: verdana,arial,sans-serif; font-size: 10pt">
                    <div align="left" style="font-family: verdana,arial,sans-serif; font-size: 10pt">
                      <table cellSpacing="0" cellPadding="3" width="100%" border="0" height="116">
                        <tr>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <p align="right"><b><font face="Tahoma">To</font><font face="Tahoma" size="2">:</font></b></p>
                          </td>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <input type="text" name="to" size="25" value="in(to)" tabindex="2"></td>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <font face="Tahoma">&nbsp;&nbsp;&nbsp;</font></td>
                        </tr>
                        <tr>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <p align="right"><b><font face="Tahoma">From</font></b><font face="Tahoma" size="2"><b>:</b></font></p>
                          </td>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <input type="text" name="from" size="25" value="in(from)" tabindex="2"></td>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <font face="Tahoma">&nbsp;&nbsp;&nbsp;</font></td>
                        </tr>
                        <tr>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <p align="right"><b><font face="Tahoma">Subject</font></b><font face="Tahoma" size="2"><b>:</b></font></p>
                          </td>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <input type="text" name="subject" size="25" value="in(subject)" tabindex="2"></td>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" height="26">
                          <font face="Tahoma">&nbsp;&nbsp;&nbsp;</font></td>
                        </tr>
                        <tr>
                          <td style="font-family: verdana,arial,sans-serif; font-size: 10pt" colspan="3" align="center" height="78">
                          <textarea rows="5" name="message" cols="50" tabindex="3">in(message)</textarea></td>
                        </tr>
                      </table>
                    </div>
                    </td>
                  </tr>
                </table>
                </td>
              </tr>
            </table>
            </td>
          </tr>
          <tr>
            <td style="font-size: 10pt; font-family: verdana,arial,sans-serif" width="100%">
            <table cellSpacing="0" borderColorDark="#ffffff" cellPadding="5" width="100%" bgColor="#c0c0c0" borderColorLight="#000000" border="1">
              <tr>
                <td style="font-size: 10pt; font-family: verdana,arial,sans-serif" width="100%">
                <p align="center">
                          <font face="Tahoma">
                          <input type="submit" value="Email Now"></font></p>
                </td>
              </tr>
            </table>
            </td>
          </tr>
          <tr>
            <td style="font-size: 10pt; font-family: verdana,arial,sans-serif" width="100%">
            <table cellSpacing="0" borderColorDark="#ffffff" cellPadding="5" width="100%" bgColor="#c0c0c0" borderColorLight="#000000" border="1">
              <tr>
                <td style="font-size: 10pt; font-family: verdana,arial,sans-serif" width="100%">
                <font face="Tahoma" size="1">
                <p align="center"><font size="2"><b>
                <a href="http://www.cgiscript.net"><font face="Tahoma" size="1">
                Powered by csLiveSupport - © 1999-2002&nbsp; -&nbsp; WWW.CGISCRIPT.NET, 
                LLC</font></a></b></font></font></p>
                </td>
              </tr>
            </table>
            </td>
          </tr>
        </table>
        </td>
      </tr>
    </table>
    </center>
  </div>
</form>
<script language=javascript>
document.forms[0].to.focus();
</script>
</body>
</html>
