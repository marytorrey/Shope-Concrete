<head>
<title>csLiveSupport</title>
</head>

<body>

<form name="form1" action="in(cgiurl)" method="post" onSubmit="SetPass();">
  <input type="hidden" name="command" value="ss">
  <div align="center">
    <center>
    <table border="0" cellpadding="5" cellspacing="0" width="100%" height="100%">
      <tr>
        <td width="100%" align="center">
        <table WIDTH="400" HEIGHT="240" BORDER="0" CELLPADDING="0" CELLSPACING="0">
          <tr>
            <td ROWSPAN="3" WIDTH="156" HEIGHT="240">
            <img SRC="in(htmlurl)/images/live_support-login_01.gif" width="156" height="240"></td>
            <td WIDTH="244" HEIGHT="62">
            <img SRC="in(htmlurl)/images/live_support-login_02.gif" width="244" height="62"></td>
          </tr>
          <tr>
            <td WIDTH="244" HEIGHT="165" background="in(htmlurl)/images/live_support-login_03.gif" align="center">
            <table border="0" cellpadding="3" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="0">
              <tr>
                <td colspan="2" align="center">
                <table border="0" cellpadding="2" cellspacing="0" style="border-collapse: collapse" bordercolor="#111111" width="100%">
                  <tr>
                    <td width="100%" align="center">
                    <p align="center"><font size="2" face="Tahoma">Type your admin. username and<br>
                    password to enter the system.</font></p>
                    </td>
                  </tr>
                </table>
                </td>
              </tr>
              <tr>
                <td align="right"><font size="2" face="Tahoma">Username: </font>
                </td>
                <td align="left">
                <input name="UserName" size="14"></td>
              </tr>
              <tr>
                <td align="right"><font size="2" face="Tahoma">Password: </font>
                </td>
                <td align="left">
                <input type="password" name="PassWord" size="14"></td>
              </tr>
              <tr>
                <td colspan="2" align="center">
                <input type="submit" value="Login"></td>
              </tr>
            </table>
            </td>
          </tr>
          <tr>
            <td WIDTH="244" HEIGHT="13">
            <img SRC="in(htmlurl)/images/live_support-login_04.gif" width="244" height="13"></td>
          </tr>
        </table>
        </td>
      </tr>
    </table>
    </center>
  </div>
</form>

</body>
<script language="javascript">
document.form1.UserName.focus();
function SetPass(){
var UserName = document.form1.UserName.value;
var PassWord = document.form1.PassWord.value;
if(!UserName){
alert("Error. Please enter a username");
return false;
}
if(!PassWord){
alert("Error. Please enter a password");
return false;
}
document.cookie = "UserName="+UserName+";path=/";
document.cookie = "PassWord="+PassWord+";path=/";
return true;
}
        </script>

</html>
