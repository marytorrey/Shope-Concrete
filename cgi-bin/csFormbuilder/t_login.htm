<script language="javascript">
document.form1.UserName.focus();

if(GetCookie("RM") == 1){
	document.form1.UserName.value = GetCookie("UserName");
	document.form1.PassWord.value = GetCookie("PassWord");
	document.form1.rm.checked = true;
	}

function SetPass(){
var UserName = document.form1.UserName.value;
var PassWord = document.form1.PassWord.value;

if(!UserName){
	alert("Error. Please enter a username");
	return false;
	}
if(!PassWord){
	alert("Error. Please enter a password");
	return false;
	}

if(document.form1.rm.checked){
	document.cookie = "UserName="+UserName+";Path=/;Expires="+getFuture(999);
	document.cookie = "PassWord="+PassWord+";Path=/;Expires="+getFuture(999);
	document.cookie = "RM=1;Path=/;Expires="+getFuture(999);
	}
else{
	document.cookie = "UserName="+UserName+";Path=/";
	document.cookie = "PassWord="+PassWord+";Path=/";
	document.cookie = "RM=0;Path=/;Expires="+getFuture(999);
	}
return true;
}


function getFuture(f){
var d = new Date();
d.setTime(d.getTime() + (86400000 * f));
return d;
}

// Ronnie Moore: Visit him at http://www.ronniemoore.com
function GetCookie (name) {
var arg = name + "=";
var alen = arg.length;
var clen = document.cookie.length;
var i = 0;
while (i < clen) {
  var j = i + alen;
  if (document.cookie.substring(i, j) == arg)
  return getCookieVal (j);
  i = document.cookie.indexOf(" ", i) + 1;
  if (i == 0) break;
  }
  return null;
  }

function getCookieVal (offset) {
var endstr = document.cookie.indexOf (";", offset);
if (endstr == -1)
  endstr = document.cookie.length;
  return unescape(document.cookie.substring(offset, endstr));
}
</script>
